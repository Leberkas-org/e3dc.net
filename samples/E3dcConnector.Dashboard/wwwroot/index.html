<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E3DC Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1e22;--surface:#22272d;--border:#2d3339;--raised:#2a3038;
  --green:#5CC244;--lime:#D4FC37;--dark:#2E3538;
  --text:#e8ebe4;--dim:#7a8490;--red:#e85454;--blue:#54a8e8;
  --font-mono:'JetBrains Mono',monospace;--font-sans:'Outfit',sans-serif;
  --glow:0 0 20px rgba(92,194,68,.15);
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse at 20% 0%,rgba(92,194,68,.06) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 100%,rgba(212,252,55,.04) 0%,transparent 50%);
  pointer-events:none;z-index:0}

.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;border-bottom:1px solid var(--border);position:relative;z-index:1;
}
.header h1{font-size:1.1rem;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;gap:.6rem}
.header h1 span{color:var(--green);font-family:var(--font-mono);font-weight:700;font-size:.85rem;
  background:rgba(92,194,68,.1);padding:.15rem .5rem;border-radius:4px;border:1px solid rgba(92,194,68,.2)}
.status{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--dim);font-family:var(--font-mono)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--red);transition:background .3s}
.status-dot.live{background:var(--green);box-shadow:0 0 8px rgba(92,194,68,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.grid{
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;
  gap:1px;padding:1px;position:relative;z-index:1;background:var(--border);
  max-width:1200px;margin:2rem auto;border-radius:12px;overflow:hidden;
}
@media(max-width:768px){.grid{grid-template-columns:1fr;margin:1rem}}

.card{background:var(--surface);padding:1.5rem 2rem;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--green);opacity:0;transition:opacity .4s}
.card.active::after{opacity:1}
.card-label{font-size:.7rem;font-family:var(--font-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
.card-value{font-size:2.8rem;font-family:var(--font-mono);font-weight:700;line-height:1;transition:color .3s}
.card-unit{font-size:1rem;font-weight:400;color:var(--dim);margin-left:.3rem}
.card-sub{font-size:.8rem;color:var(--dim);margin-top:.5rem;font-family:var(--font-mono)}

.card-value.positive{color:var(--green)}
.card-value.negative{color:var(--red)}
.card-value.neutral{color:var(--dim)}

.direction{display:inline-block;font-size:.65rem;padding:.1rem .4rem;border-radius:3px;font-family:var(--font-mono)}
.direction.producing{background:rgba(92,194,68,.15);color:var(--green)}
.direction.consuming{background:rgba(232,84,84,.15);color:var(--red)}
.direction.idle{background:rgba(122,132,144,.15);color:var(--dim)}

.battery-section{
  grid-column:1/-1;background:var(--surface);padding:2rem;
  display:grid;grid-template-columns:1fr 2fr;gap:2rem;align-items:center;
}
@media(max-width:768px){.battery-section{grid-template-columns:1fr}}

.soc-ring{position:relative;width:160px;height:160px;margin:0 auto}
.soc-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.soc-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.soc-ring .track{stroke:var(--border)}
.soc-ring .fill{stroke:var(--green);transition:stroke-dashoffset 1s ease,stroke .3s;filter:drop-shadow(0 0 6px rgba(92,194,68,.4))}
.soc-ring .fill.low{stroke:var(--red)}
.soc-ring .fill.mid{stroke:#e8b454}
.soc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.soc-value{font-size:2.2rem;font-family:var(--font-mono);font-weight:700}
.soc-label{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono)}

.bat-details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
@media(max-width:768px){.bat-details{grid-template-columns:1fr 1fr}}
.bat-stat{background:var(--raised);border-radius:8px;padding:1rem;border:1px solid var(--border)}
.bat-stat-label{font-size:.65rem;font-family:var(--font-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}
.bat-stat-value{font-size:1.3rem;font-family:var(--font-mono);font-weight:700}
.bat-stat-unit{font-size:.75rem;color:var(--dim)}

.metrics{
  grid-column:1/-1;background:var(--surface);padding:1.5rem 2rem;
  display:flex;gap:3rem;justify-content:center;
}
@media(max-width:768px){.metrics{flex-direction:column;gap:1rem;align-items:center}}
.metric{text-align:center}
.metric-value{font-size:1.8rem;font-family:var(--font-mono);font-weight:700;color:var(--lime)}
.metric-label{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);margin-top:.25rem}

.footer{
  text-align:center;padding:1.5rem;font-size:.7rem;color:var(--dim);
  font-family:var(--font-mono);position:relative;z-index:1;
}
.footer a{color:var(--green);text-decoration:none}

.fade-in{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.2s}
.battery-section{animation-delay:.25s}
.metrics{animation-delay:.3s}
</style>
</head>
<body>

<header class="header">
  <h1>E3DC <span>S10 PRO</span> Dashboard</h1>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Connecting...</span>
  </div>
</header>

<div class="grid">

  <div class="card fade-in" id="pvCard">
    <div class="card-label">Solar Production <span class="direction producing" id="pvDir">--</span></div>
    <div class="card-value positive" id="pvValue">--<span class="card-unit">W</span></div>
    <div class="card-sub" id="pvSub">&nbsp;</div>
  </div>

  <div class="card fade-in" id="homeCard">
    <div class="card-label">Home Consumption <span class="direction consuming" id="homeDir">--</span></div>
    <div class="card-value" id="homeValue">--<span class="card-unit">W</span></div>
    <div class="card-sub" id="homeSub">&nbsp;</div>
  </div>

  <div class="card fade-in" id="batCard">
    <div class="card-label">Battery <span class="direction" id="batDir">--</span></div>
    <div class="card-value" id="batValue">--<span class="card-unit">W</span></div>
    <div class="card-sub" id="batSub">&nbsp;</div>
  </div>

  <div class="card fade-in" id="gridCard">
    <div class="card-label">Grid <span class="direction" id="gridDir">--</span></div>
    <div class="card-value" id="gridValue">--<span class="card-unit">W</span></div>
    <div class="card-sub" id="gridSub">&nbsp;</div>
  </div>

  <div class="battery-section fade-in">
    <div class="soc-ring">
      <svg viewBox="0 0 160 160">
        <circle class="track" cx="80" cy="80" r="68"/>
        <circle class="fill" id="socRing" cx="80" cy="80" r="68"
          stroke-dasharray="427.3" stroke-dashoffset="427.3"/>
      </svg>
      <div class="soc-center">
        <div class="soc-value" id="socValue">--%</div>
        <div class="soc-label">State of Charge</div>
      </div>
    </div>
    <div class="bat-details">
      <div class="bat-stat">
        <div class="bat-stat-label">Voltage</div>
        <div class="bat-stat-value"><span id="batVoltage">--</span> <span class="bat-stat-unit">V</span></div>
      </div>
      <div class="bat-stat">
        <div class="bat-stat-label">Current</div>
        <div class="bat-stat-value"><span id="batCurrent">--</span> <span class="bat-stat-unit">A</span></div>
      </div>
      <div class="bat-stat">
        <div class="bat-stat-label">Charge Cycles</div>
        <div class="bat-stat-value"><span id="batCycles">--</span></div>
      </div>
    </div>
  </div>

  <div class="metrics fade-in">
    <div class="metric">
      <div class="metric-value" id="autarky">--%</div>
      <div class="metric-label">Autarky</div>
    </div>
    <div class="metric">
      <div class="metric-value" id="selfCons">--%</div>
      <div class="metric-label">Self-Consumption</div>
    </div>
  </div>

</div>

<footer class="footer">
  Powered by <a href="/architecture/">e3dc-connector</a> &middot; RSCP over Akka.Streams
</footer>

<script>
const $ = id => document.getElementById(id);
const circumference = 2 * Math.PI * 68;

function fmt(w) { return Math.abs(w) >= 1000 ? (w/1000).toFixed(1)+'k' : w.toString(); }

function dirLabel(watts, posLabel, negLabel) {
  if (watts > 50) return posLabel;
  if (watts < -50) return negLabel;
  return 'IDLE';
}

function dirClass(watts, posClass, negClass) {
  if (watts > 50) return posClass;
  if (watts < -50) return negClass;
  return 'idle';
}

function valClass(watts, invert) {
  if (Math.abs(watts) < 50) return 'neutral';
  if (invert) return watts > 0 ? 'negative' : 'positive';
  return watts > 0 ? 'positive' : 'negative';
}

function update(d) {
  $('statusDot').classList.add('live');
  $('statusText').textContent = new Date(d.timestamp).toLocaleTimeString();

  // PV
  $('pvValue').innerHTML = fmt(d.pvWatts) + '<span class="card-unit">W</span>';
  $('pvValue').className = 'card-value ' + (d.pvWatts > 50 ? 'positive' : 'neutral');
  $('pvDir').textContent = d.pvWatts > 50 ? 'PRODUCING' : 'IDLE';
  $('pvDir').className = 'direction ' + (d.pvWatts > 50 ? 'producing' : 'idle');
  $('pvCard').classList.toggle('active', d.pvWatts > 50);

  // Home
  $('homeValue').innerHTML = fmt(d.homeWatts) + '<span class="card-unit">W</span>';
  $('homeValue').className = 'card-value';
  $('homeDir').textContent = d.homeWatts > 50 ? 'CONSUMING' : 'IDLE';
  $('homeDir').className = 'direction ' + (d.homeWatts > 50 ? 'consuming' : 'idle');
  $('homeCard').classList.toggle('active', d.homeWatts > 50);

  // Battery: negative = charging, positive = discharging
  $('batValue').innerHTML = fmt(Math.abs(d.batteryWatts)) + '<span class="card-unit">W</span>';
  $('batValue').className = 'card-value ' + valClass(d.batteryWatts, false);
  $('batDir').textContent = dirLabel(d.batteryWatts, 'DISCHARGING', 'CHARGING');
  $('batDir').className = 'direction ' + dirClass(d.batteryWatts, 'consuming', 'producing');
  $('batSub').textContent = d.batteryWatts < -50 ? 'Storing excess solar' : d.batteryWatts > 50 ? 'Powering home' : '';
  $('batCard').classList.toggle('active', Math.abs(d.batteryWatts) > 50);

  // Grid: negative = feeding in, positive = importing
  $('gridValue').innerHTML = fmt(Math.abs(d.gridWatts)) + '<span class="card-unit">W</span>';
  $('gridValue').className = 'card-value ' + valClass(d.gridWatts, true);
  $('gridDir').textContent = dirLabel(d.gridWatts, 'IMPORTING', 'FEED-IN');
  $('gridDir').className = 'direction ' + dirClass(d.gridWatts, 'consuming', 'producing');
  $('gridSub').textContent = d.gridWatts < -50 ? 'Selling to grid' : d.gridWatts > 50 ? 'Buying from grid' : '';
  $('gridCard').classList.toggle('active', Math.abs(d.gridWatts) > 50);

  // SOC
  var soc = d.soc ?? 0;
  var offset = circumference - (soc / 100) * circumference;
  var ring = $('socRing');
  ring.style.strokeDashoffset = offset;
  ring.classList.toggle('low', soc < 20);
  ring.classList.toggle('mid', soc >= 20 && soc < 50);
  $('socValue').textContent = soc.toFixed(1) + '%';

  // Battery details
  $('batVoltage').textContent = (d.batteryVoltage ?? 0).toFixed(1);
  $('batCurrent').textContent = (d.batteryCurrent ?? 0).toFixed(1);
  $('batCycles').textContent = d.chargeCycles ?? '--';

  // Metrics
  $('autarky').textContent = (d.autarky ?? 0).toFixed(1) + '%';
  $('selfCons').textContent = (d.selfConsumption ?? 0).toFixed(1) + '%';
}

var es = new EventSource('/api/stream');
es.onmessage = function(e) { update(JSON.parse(e.data)); };
es.onerror = function() {
  $('statusDot').classList.remove('live');
  $('statusText').textContent = 'Reconnecting...';
};
</script>
</body>
</html>
