name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: 'Package version (without v prefix)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0 or v0.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Determine version
        id: version
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          echo "pkg_version=${RAW#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Pack E3dc.Net
        run: dotnet pack src/E3dc.Net -c Release --no-build -o ./nupkg -p:PackageVersion=${{ steps.version.outputs.pkg_version }}

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Dirnei

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
